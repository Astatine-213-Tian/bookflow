[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bookflow"
version = "0.1.0"
description = "Acquire, prepare, translate and export books to EPUB, TXT and Notion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "notion-books==0.10.0",
    "beautifulsoup4==4.14.3",
    "cssselect2>=0.10.1",
    "EbookLib==0.20",
    "httpx==0.28.1",
    "lxml==6.1.0",
    "mcp==1.26.0",
    "opencc-python-reimplemented==0.1.7",
    "pillow>=11.3,<13",
    "requests==2.33.1",
    "tinycss2>=1.5.1",
    "tqdm==4.67.1",
    "zendriver==0.15.3",
    "jsonschema>=4.23,<5",
    "referencing>=0.36,<1",
]

[project.scripts]
book-ingest = "src.cli.ingest:main"
book-prepare = "src.cli.prepare_book:main"
book-update = "src.cli.update_book:main"
book-compare = "src.cli.compare_editions:main"
book-crawl = "src.cli.crawl:main"
book-translate = "src.cli.translate:main"
book-dataset = "src.cli.dataset:main"
book-normalize = "src.cli.normalize_epub:main"
book-enrich-metadata = "src.cli.enrich_epub_metadata:main"
book-notion = "src.cli.notion_book:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv.sources]
notion-books = { git = "https://github.com/Astatine-213-Tian/notion-books", tag = "v0.10.0" }

[tool.setuptools.package-data]
"src.content" = ["*.json"]
